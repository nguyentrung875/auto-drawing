<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 760" width="540" height="760">
  <rect width="540" height="760" fill="#0f211d"/>
  <!-- Title -->
  <text x="270" y="50" font-family="sans-serif" font-size="22" font-weight="bold" fill="#4ade80" text-anchor="middle">99 ➔ Hổ (Ví dụ REJECT - Thất bại)</text>
  <text x="270" y="80" font-family="sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Đề xuất bậy: 2 vòng số 9 làm tai, nhưng 2 đuôi số 9 đâm xuyên má hổ không thành cái gì.</text>
  
  <!-- Drawing Body -->
  <g transform="translate(0, 30)">
  <!-- Step 1: Số 9 trái mồ côi -->
  <path d="M 240 396 A 60 60 0 1 1 253 340 C 258 420 246 478 232 528" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Step 2: Số 9 phải mồ côi -->
  <path d="M 390 396 A 60 60 0 1 1 403 340 C 408 420 396 478 382 528" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Step 3: Vòng đầu đè lên số 9 -->
  <path d="M 175 450 A 95 95 0 1 1 365 450 A 95 95 0 1 1 175 450" fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Step 4: Mắt mũi miệng -->
  <path d="M 238 440 l 0.01 0 M 302 440 l 0.01 0 M 258 478 L 282 478 L 270 492 Z M 270 492 Q 258 508 244 500 M 270 492 Q 282 508 296 500" fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  </g>

  <!-- Footer Info -->
  <rect x="20" y="690" width="500" height="50" rx="8" fill="#132420" stroke="#24443b"/>
  <text x="35" y="720" font-family="monospace" font-size="12" fill="#facc15">Vàng: Nét Hook (99)</text>
  <text x="230" y="720" font-family="monospace" font-size="12" fill="#ffffff">Trắng: Nét thêm vào</text>
  <text x="440" y="720" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ef4444">REJECT</text>
</svg>
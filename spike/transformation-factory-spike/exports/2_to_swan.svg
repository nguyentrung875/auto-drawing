<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 760" width="540" height="760">
  <rect width="540" height="760" fill="#0f211d"/>
  <!-- Title -->
  <text x="270" y="50" font-family="sans-serif" font-size="22" font-weight="bold" fill="#4ade80" text-anchor="middle">2 ➔ Thiên nga lướt sóng</text>
  <text x="270" y="80" font-family="sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Nét cong trên số 2 → ĐẦU & CỔ. Nét ngang số 2 → MẶT NƯỚC / BỤNG.</text>
  
  <!-- Drawing Body -->
  <g transform="translate(0, 30)">
  <!-- Step 1: Số 2 → ĐẦU, CỔ UỐN LƯỢN & ĐƯỜNG NƯỚC -->
  <path d="M 190 360 C 190 292 288 282 306 336 C 322 384 236 452 196 566 L 372 566" fill="none" stroke="#facc15" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Step 2: Lưng và thân thiên nga -->
  <path d="M 196 566 C 214 496 306 474 372 512 C 398 528 396 552 372 566" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Step 3: Cánh và đuôi vũ nữ -->
  <path d="M 244 546 C 276 512 336 512 362 542 C 330 562 278 564 244 546 Z M 368 514 C 402 498 424 474 432 444" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Step 4: Mỏ, mắt và gợn sóng nước -->
  <path d="M 302 320 L 344 334 L 300 346 Z M 286 314 l 0.01 0 M 132 600 Q 172 588 212 600 M 300 612 Q 348 600 396 612" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  </g>

  <!-- Footer Info -->
  <rect x="20" y="690" width="500" height="50" rx="8" fill="#132420" stroke="#24443b"/>
  <text x="35" y="720" font-family="monospace" font-size="12" fill="#facc15">Vàng: Nét Hook (2)</text>
  <text x="230" y="720" font-family="monospace" font-size="12" fill="#ffffff">Trắng: Nét thêm vào</text>
  <text x="440" y="720" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4ade80">PASS GATE</text>
</svg>
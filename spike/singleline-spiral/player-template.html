<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Single-Line Player — Spiral Portrait (spike)</title>
<style>
  body { background:#0c1412; color:#f1f5f9; font-family:sans-serif; margin:0; padding:24px;
         display:flex; flex-direction:column; align-items:center; gap:14px; }
  h2 { margin:0; font-size:18px; } h2 span { color:#4ade80; }
  .stage { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }
  .frame { width:340px; height:480px; border:2px solid #24443b; border-radius:10px; overflow:hidden;
           background:#0f211d; position:relative; }
  .frame svg { width:100%; height:100%; display:block; }
  .frame img { width:100%; height:100%; object-fit:cover; display:block; filter:grayscale(1); }
  .cap { text-align:center; font-size:12px; color:#94a3b8; margin-top:6px; }
  .bar { width:min(720px,90vw); height:8px; background:#182c27; border-radius:4px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:#4ade80; }
  .row { display:flex; gap:10px; align-items:center; font-size:13px; color:#94a3b8; }
  button { background:#4ade80; color:#052e16; border:none; padding:9px 22px; border-radius:6px;
           font-weight:700; cursor:pointer; font-size:14px; }
</style>
</head>
<body>
<h2>Single-Line Spiral — <span>1 nét duy nhất, không nhấc bút</span></h2>
<div class="stage">
  <div><div class="frame">
    <svg viewBox="0 0 540 760"><path id="spiral" d="__PATH_D__" fill="none"
      stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div><div class="cap">Nét vẽ (timelapse mô phỏng)</div></div>
  <div><div class="frame"><img alt="ảnh gốc" src="data:image/png;base64,__ORIG_B64__"></div>
  <div class="cap">Ảnh gốc (hiện để đối chiếu lúc reveal)</div></div>
</div>
<div class="bar"><i id="prog"></i></div>
<div class="row">
  <button id="btn" onclick="play()">▶ Vẽ (24s)</button>
  <span id="stat">Sẵn sàng — 1 stroke duy nhất.</span>
</div>
<script>
const p = document.getElementById("spiral");
const len = p.getTotalLength();
p.style.strokeDasharray = len;
p.style.strokeDashoffset = len;
let raf = null;
function play(dur = 24000) {
  cancelAnimationFrame(raf);
  const t0 = performance.now();
  const prog = document.getElementById("prog"), stat = document.getElementById("stat");
  document.getElementById("btn").disabled = true;
  (function frame(t) {
    const k = Math.min((t - t0) / dur, 1);
    p.style.strokeDashoffset = len * (1 - k);
    prog.style.width = (k * 100).toFixed(1) + "%";
    stat.textContent = k < 1 ? `Đang vẽ… ${(k*100).toFixed(0)}% (không nhấc bút)` : "🎉 Reveal! So sánh với ảnh gốc →";
    if (k < 1) raf = requestAnimationFrame(frame);
    else document.getElementById("btn").disabled = false;
  })(t0);
}
</script>
</body>
</html>
